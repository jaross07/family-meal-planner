services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.25.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9925:9000"
    environment:
      ALLOW_SIGNUP: "false"
      TZ: America/Los_Angeles
      BASE_URL: ${MEALIE_BASE_URL}
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
      POSTGRES_SERVER: mealie-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
    volumes:
      - mealie-data:/app/data
    depends_on:
      mealie-db:
        condition: service_healthy

  mealie-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
      POSTGRES_DB: mealie
    volumes:
      - mealie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 5

  planner:
    build: ./planner
    restart: unless-stopped
    ports:
      - "127.0.0.1:9930:8000"
    environment:
      TZ: America/Los_Angeles
      MEALIE_INTERNAL_URL: http://mealie:9000
      MEALIE_PUBLIC_URL: ${MEALIE_BASE_URL}
      MEALIE_SERVICE_TOKEN: ${MEALIE_SERVICE_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://planner:${PLANNER_DB_PASSWORD}@planner-db:5432/planner
    depends_on:
      planner-db:
        condition: service_healthy
      mealie:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  planner-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${PLANNER_DB_PASSWORD}
      POSTGRES_DB: planner
    volumes:
      - planner-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 10s
      timeout: 5s
      retries: 5


  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  mealie-data:
  mealie-pgdata:
  planner-pgdata:

